syntax = "proto3";

package financial_agent;

message ChatRequest {
  string conversation_id = 1;
  string message = 2;
  string model_name = 3;
}

message ToolCallStart {
  string tool_name = 1;
  string arguments_json = 2;
}

message ToolCallEnd {
  string tool_name = 1;
  string output_json = 2;
  int64 execution_time_ms = 3;
}

message TextChunk {
  string text = 1;
  bool is_final_chunk = 2;
}

message HRPOptimizationResult {
  repeated string symbols = 1;
  repeated float weights = 2;
  string summary_notes = 3;
}

message StreamEvent {
  string event_id = 1;
  string timestamp = 2;
  oneof payload {
    TextChunk text_chunk = 3;
    ToolCallStart tool_start = 4;
    ToolCallEnd tool_end = 5;
    HRPOptimizationResult hrp_result = 6;
    string error_message = 7;
    bool is_finished = 8;
  }
}
